<!doctype html><html lang="pt-BR" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A · Consulta — Qual roteiro · proposta de layout</title><link rel="stylesheet" href="assets/tokens.css"><link rel="stylesheet" href="assets/kit.css"><link rel="stylesheet" href="assets/a.css"></head><body><div class="app">
<nav class="rail" aria-label="Módulos"><a class="logo" href="index.html" aria-label="Qual roteiro"><span>q<b>r</b></span></a><a class="nav" href="#" aria-current="page" style="--mod:var(--mod-route)"><span class="ic" style="--mod:var(--mod-route);color:hsl(var(--mod-route))"><span data-i="route" data-ic="" style="display:inline-flex"></span></span><span>Rota & Custos</span></a><a class="nav" href="#"  style="--mod:var(--mod-plan)"><span class="ic" style="--mod:var(--mod-plan);color:hsl(var(--mod-plan))"><span data-i="calendar" data-ic="" style="display:inline-flex"></span></span><span>Planejar</span></a><a class="nav" href="#"  style="--mod:var(--mod-stay)"><span class="ic" style="--mod:var(--mod-stay);color:hsl(var(--mod-stay))"><span data-i="bed" data-ic="" style="display:inline-flex"></span></span><span>Hospedagem</span></a><a class="nav" href="#"  style="--mod:var(--mod-act)"><span class="ic" style="--mod:var(--mod-act);color:hsl(var(--mod-act))"><span data-i="ticket" data-ic="" style="display:inline-flex"></span></span><span>Atividades</span></a><a class="nav" href="#"  style="--mod:var(--mod-food)"><span class="ic" style="--mod:var(--mod-food);color:hsl(var(--mod-food))"><span data-i="utensils" data-ic="" style="display:inline-flex"></span></span><span>Restaurantes</span></a><span class="sp"></span>
 <button class="nav desk" data-theme-toggle></button><button class="nav desk" aria-label="Conta"><span class="ic"><span data-i="user" data-ic="" style="display:inline-flex"></span></span><span>Conta</span></button></nav>
<main class="stage"><div class="map" data-pad="a" data-map="pins"></div>
 <div class="topchip"><b>Nova consulta</b><button class="btn btn-ghost btn-sm btn-icon" data-theme-toggle></button></div>
 <section class="panel" data-sheet="full" aria-label="Painel">
<div class="head"><h1>Quanto custa essa viagem?</h1></div>
<div class="scroll"><form class="stack" onsubmit="return false">
 <div class="trip"><div class="rail"><i></i><b></b><em></em></div>
  <div class="fields"><div class="input"><span data-i="pin" data-ic="" style="display:inline-flex"></span><input aria-label="Origem" placeholder="Origem — cidade, estado ou endereço" value="São Paulo, SP"></div>
   <div class="input"><span data-i="pin" data-ic="" style="display:inline-flex"></span><input aria-label="Destino" placeholder="Destino — cidade, estado ou endereço" value="Rio de Janeiro, RJ"></div></div>
  <button class="btn btn-ghost btn-icon" type="button" aria-label="Inverter origem e destino" style="align-self:center"><span data-i="swap" data-ic="" style="display:inline-flex"></span></button></div>
 <button class="btn btn-ghost btn-sm" type="button" style="align-self:flex-start;margin:-8px 0 0 -4px"><span data-i="plus" data-ic="sm" style="display:inline-flex"></span> Adicionar parada</button>
 <div class="field"><span class="lbl">Veículo</span><div class="seg" role="group" aria-label="Tipo de veículo">
 <button aria-pressed="true"><span data-i="car" data-ic="" style="display:inline-flex"></span>Carro</button><button aria-pressed="false"><span data-i="moto" data-ic="" style="display:inline-flex"></span>Moto</button><button aria-pressed="false"><span data-i="bus" data-ic="" style="display:inline-flex"></span>Ônibus</button><button aria-pressed="false"><span data-i="truck" data-ic="" style="display:inline-flex"></span>Caminhão</button></div></div>
 <div class="row2"><div class="field"><label>Eixos (pedágio)</label><div class="input"><select aria-label="Eixos"><option>2 eixos · simples</option><option>3 eixos</option></select></div></div>
  <div class="field"><label>Consumo</label><div class="input"><input class="num" value="10" inputmode="decimal"><span class="unit">km/L</span></div></div></div>
 <div class="row2"><div class="field"><label>Combustível</label><div class="input"><span class="unit">R$</span><input class="num" value="6,00" inputmode="decimal"><span class="unit">/L</span></div></div>
  <div class="field"><label>Ida e volta</label><div style="display:flex;align-items:center;gap:10px;min-height:44px"><button class="switch" role="switch" aria-checked="false" aria-label="Calcular volta"></button><span class="muted">Calcular volta</span></div></div></div>
 <details class="acc"><summary><span data-i="tune" data-ic="" style="display:inline-flex"></span> Opções de trajeto <span class="chev sum"><span data-i="chev" data-ic="" style="display:inline-flex"></span></span></summary><div class="body" style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" aria-pressed="false">Evitar pedágios</button><button class="chip" aria-pressed="false">Evitar balsas</button><button class="chip" aria-pressed="true">Mostrar postos</button></div></details>
 <a class="btn btn-accent btn-block" href="a-resultado.html" style="min-height:52px;font-size:16px">Calcular rota <span data-i="right" data-ic="" style="display:inline-flex"></span></a>
 <p class="note">Valores de pedágio vêm da base da ANTT; confira a tarifa antes de viajar.</p>
</form></div></section>
 <button class="panel-toggle" aria-label="Recolher painel"><span data-i="left" data-ic="" style="display:inline-flex"></span></button></main></div><script src="assets/mock.js"></script></html>
